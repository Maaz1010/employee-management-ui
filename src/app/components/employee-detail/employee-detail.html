<div class="max-w-md mx-auto p-6">
  <h1 class="text-2xl font-bold mb-4">Employee Details</h1>

  @if (loading()) {
    <h1 class="text-xl font-semibold">Loading...</h1>
  } @else if (errorMessage()) {
    <p class="text-red-600">{{ errorMessage() }}</p>
    <a routerLink="/employees" 
    class="inline-block mt-4 text-bold bg-indigo-500 hover:bg-indigo-600 text-white p-2 rounded">
    Back to list</a>
  } @else if (employee(); as emp) {
    <div class="border rounded p-4 space-y-2">
      <p><span class="font-semibold">ID:</span> {{ emp.id }}</p>
      <p><span class="font-semibold">Name:</span> {{ emp.name }}</p>
      <p><span class="font-semibold">Phone:</span> {{ emp.phone }}</p>
      <p><span class="font-semibold">Email:</span> {{ emp.email }}</p>
    </div>

    <div class="mt-4 space-x-3">
      <a [routerLink]="['/employees', emp.id, 'edit']" class="text-green-600 p-2">Edit</a>
      <a routerLink="/employees" class="text-gray-600">Back to list</a>
    </div>
  }
</div>
